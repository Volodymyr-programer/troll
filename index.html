<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .body,html{
        margin: 0;
        overflow: hidden;
        width: 100vh;
        height:100hv;
    }
     #k {
        position: absolute;
        top: 0;
        left: 0;
        z-index: -1;
    }
    #text, #but, #smile {
        position: relative;
        z-index: 1;
        margin: 20px;
        left:50%;
        top:45%;
    }
    #smile{
         left:90%;
        background-image: url(good.png);
          z-index: 1;
          width: 100px;
          height:100px;
           background-size: contain; 
        background-repeat: no-repeat; 
    }
    #but{
        left:45%;
        background-color: deeppink;
        border: 1px black relative;
        position: absolute;
         z-index: 2;
         width: 100px;
         height: 45px;
    }
    #text{
        font-size: xx-large;
        left:75%;
        font-family: Georgia, 'Times New Roman', Times, serif;
    }
    .d{
        position: absolute;
        z-index: 1;
    }
    #d1{
        margin: 0;
        left: 0;
        top: 0;
        height: 100vh;
        width: 45vw;
    }
     #d2{
        margin: 0;
        right: 0;
        top: 0;
        height: 100vh;
        width: 45vw;
    }
     #d3{
        margin: 0;
        left: 30%;
        top: 0;
        height: 100vh;
        width: 45vw;
        pointer-events: none;
    }
      #d4{
        margin: 0;
        right: 0;
        top: 0;
        height: 45vh;
        width: 100vw;
        pointer-events: none;
    }
      #d5{
        margin: 0;
        right: 0;
        bottom: 0;
        height: 45vh;
        width: 100vw;
        pointer-events: none;
    }
</style>
</head>
<body>
<div id = "smile"></div>
    <div id="text">Нажміть на кнопку</div>
    <button id = "but">сюди</button>
    <div class = "d" id = "d1"></div>
    <div class = "d" id = "d2"></div>
    <div class = "d" id = "d3"></div>
    <div class = "d" id = "d4"></div>
    <div class = "d" id = "d5"></div>
    
    
    <script src="script.js"></script>
    
</body>
</html>
